services:
  ai-app:
    build: .
    image: ai-app-backend:latest
    container_name: ai-app-backend
    ports:
      # 宿主机 8001 -> 容器内 8000（本机 8000 被 multi-agent-platform 容器占用）
      - "8001:8000"
    volumes:
      # 持久化 SQLite 数据库
      - ./ai_app.db:/app/ai_app.db
      # 持久化向量数据库
      - ./vector_db:/app/vector_db
      # 持久化上传文件
      - ./uploads:/app/uploads
      # 环境变量文件
      - ./.env:/app/.env:ro
      # 直接挂载 Windows 本地已下载的模型缓存，无需重新下载
      - C:/Users/cat/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

